name: CI Lint/formatting checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  NO_STRIP: true

jobs:
  frontend-checks:
    runs-on: [ubuntu-24, rust-24]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Cache Bun dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install frontend dependencies
      run: bun install

    - name: Run TypeScript check
      run: bun run build

    - name: Run ESLint
      run: bun run lint

  backend-checks:
    runs-on: rust-24

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          librsvg2-dev

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: true
        components: clippy, rustfmt
        cache-workspaces: src-tauri

    - name: Run Rust formatting check
      run: |
        cd src-tauri
        cargo fmt --check

    - name: Run Clippy
      run: |
        cd src-tauri
        cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Rust tests
      run: |
        cd src-tauri
        cargo test
