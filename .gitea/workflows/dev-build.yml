name: Build AppImage (Develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NO_STRIP: true

jobs:
  build-develop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rust-src-dir: src-tauri
        toolchain: stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          xdg-utils

    - name: Install frontend dependencies
      run: bun install

    - name: Run TypeScript check
      run: |
        bun run build
        echo "TypeScript compilation successful"

    - name: Run Rust tests
      run: |
        cd src-tauri
        cargo test
        echo "Rust tests passed"

    - name: Prepare dev version
      run: |
        # Get current version from tauri.conf.json
        CURRENT_VERSION=$(grep '"version":' src-tauri/tauri.conf.json | sed 's/.*"version": "\([^"]*\)".*/\1/')

        # Create dev version with timestamp
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SHORT_SHA=$(git rev-parse --short HEAD)
        DEV_VERSION="${CURRENT_VERSION}-dev.${TIMESTAMP}.${SHORT_SHA}"

        echo "Current version: $CURRENT_VERSION"
        echo "Dev version: $DEV_VERSION"
        echo "DEV_VERSION=$DEV_VERSION" >> $GITHUB_ENV

        # Backup original tauri.conf.json
        cp src-tauri/tauri.conf.json src-tauri/tauri.conf.json.backup

        # Replace version in tauri.conf.json
        sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$DEV_VERSION\"/" src-tauri/tauri.conf.json

        echo "Modified tauri.conf.json version:"
        grep "\"version\":" src-tauri/tauri.conf.json

    - name: Build AppImage
      run: |
        echo "Building development AppImage..."
        bun run tauri build --bundles appimage

        echo "AppImage build successful!"
        ls -la src-tauri/target/release/bundle/appimage/

    - name: Restore original configuration
      if: always()
      run: |
        # Restore original tauri.conf.json
        if [ -f src-tauri/tauri.conf.json.backup ]; then
          mv src-tauri/tauri.conf.json.backup src-tauri/tauri.conf.json
          echo "Restored original tauri.conf.json"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fulcitt-pos-dev-${{ env.DEV_VERSION }}
        path: src-tauri/target/release/bundle/appimage/${{ env.APPIMAGE_NAME }}
        retention-days: 30
